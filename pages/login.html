        <h2>Student Login</h2>
        <p>Login to access your StudentHub dashboard.</p>

    <!-- Login Form -->
    <section class="container">

        <div class="card">

            <form>

                <label>Email or Enrollment Number</label><br>
                <input type="text" placeholder="Enter Email or Enrollment Number" required><br><br>

                <label>Password</label><br>
                <input type="password" placeholder="Enter Password" required><br><br>

                <input type="checkbox"> Remember Me
                <br><br>

                <button type="submit" class="btn">Login</button>

                <br><br>

                <p>
                    Don't have an account?
                    <a href="register.html">Register Here</a>
                </p>

            </form>

        </div>

    </section>
