    <!-- Header -->

        <p>Your Digital Campus Portal</p>

    <!-- Registration Form -->
    <section class="hero">
        <h2>Student Registration</h2>
        <p>Create your StudentHub account by filling out the form below.</p>
    </section>

    <section class="container">

        <div class="card">

            <form>

                <label>Full Name</label><br>
                <input type="text" placeholder="Enter Full Name" required><br><br>

                <label>Enrollment Number</label><br>
                <input type="text" placeholder="Enter Enrollment Number" required><br><br>

                <label>Email Address</label><br>
                <input type="email" placeholder="Enter Email" required><br><br>

                <label>Phone Number</label><br>
                <input type="tel" placeholder="Enter Phone Number" required><br><br>

                <label>Department</label><br>
                <select required>
                    <option value="">Select Department</option>
                    <option>Computer Engineering</option>
                    <option>Information Technology</option>
                    <option>Mechanical Engineering</option>
                    <option>Civil Engineering</option>
                    <option>Electrical Engineering</option>
                </select><br><br>

                <label>Semester</label><br>
                <select required>
                    <option value="">Select Semester</option>
                    <option>Semester 1</option>
                    <option>Semester 2</option>
                    <option>Semester 3</option>
                    <option>Semester 4</option>
                    <option>Semester 5</option>
                    <option>Semester 6</option>
                    <option>Semester 7</option>
                    <option>Semester 8</option>
                </select><br><br>

                <label>Password</label><br>
                <input type="password" placeholder="Create Password" required><br><br>

                <label>Confirm Password</label><br>
                <input type="password" placeholder="Confirm Password" required><br><br>

                <button type="submit" class="btn">Register</button>

            </form>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 StudentHub. All Rights Reserved.</p>
    </footer>
<script src="../js/script.js"></script>
</body>
</html>
